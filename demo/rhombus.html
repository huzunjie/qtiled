<body>
  <script src="./static/js/navs.js?20260921183837"></script>

  <h1>Rhombus 正菱形</h1>
  <div id="container"></div>
  <script type="text/javascript">
    (function() {
      const container = document.getElementById('container');
      const {Scene, Label, Polyline} = spritejs;
      const scene = new Scene({
          container,
          width: 800,
          height: 800,
          mode: 'static',
      });
      const layer = scene.layer('def', { handleEvent: false });

      const lineWidth = 2;

      const shapesEls = [];

      /* 图形处理试验代码 sta */
      const tileWidth = 60;
      const tileHeight = 30;
      const size = [tileWidth, tileHeight];

      const { getVertexes, getPositions, getIsometricPositions } = qtiled.shapes.rhombus;

      // 一个菱形顶点坐标集
      const rhombusVertexes = getVertexes(size); // axis = 'y'
      let pos = [60, 40];
      shapesEls.push(
        // 坐标系原点
        new Polyline({
          pos,
          points: [0, 0, lineWidth, 0],
          strokeColor: 'red',
          lineWidth,
          close: true,
        }),
        new Polyline({
          pos,
          points: rhombusVertexes,
          strokeColor: 'rgba(0, 0, 0, 0.5)',
          lineWidth,
          close: true,
        }),
        new Label({
          pos: [pos[0] + 40 , pos[1] - 10],
          text: '← 一个菱形',
        }),
      );

      // 得到错列布局坐标集
      let originPixelX = 60;
      let originPixelY = 140;
      let hexTiles = getPositions([0, 4], [0, 6], size).map(
        ([x, y]) => new Polyline({
          pos: [x + originPixelX, y + originPixelY],
          points: rhombusVertexes,
          strokeColor: 'rgba(0, 0, 0, 0.5)',
          lineWidth,
          close: true,
        })
      );
      shapesEls.push(
        // 坐标系原点
        new Polyline({
          pos: [originPixelX, originPixelY],
          points: [0, 0, lineWidth, 0],
          strokeColor: 'red',
          lineWidth,
          close: true,
        }),
        new Label({
          pos: [originPixelX - tileWidth / 2, originPixelY - 50],
          text: '↓ 一个奇数行错列的菱形网格图',
        }),
        ...hexTiles,
      );

      // 一个偶数行错列的倒序菱形网格图
      originPixelX = 680;
      originPixelY = 230;
      hexTiles = getPositions([-4.5, -0.5], [-6, 0], size, 'leftUp', 'even').map(
        ([x, y]) => new Polyline({
          pos: [x + originPixelX, y + originPixelY],
          points: rhombusVertexes,
          strokeColor: 'rgba(0, 0, 0, 0.5)',
          lineWidth,
          close: true,
        })
      );
      shapesEls.push(
        // 坐标系原点
        new Polyline({
          pos: [originPixelX, originPixelY],
          points: [0, 0, lineWidth, 0],
          strokeColor: 'red',
          lineWidth,
          close: true,
        }),
        new Label({
          pos: [380, 90],
          text: '↓ 一个偶数行错列的倒序菱形网格图',
        }),
        ...hexTiles,
      );

      // 中心点为原点的错列带边框的倒序菱形网格图
      originPixelX = 185;
      originPixelY = 420;
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;
      const maxGridX = 2;
      hexTiles = [];
      getPositions([-2, maxGridX], [-4, 4], size, 'leftUp', 'odd').forEach(([x, y, gridX, gridY]) => {
        if (gridX === maxGridX && Math.abs(gridY % 2) === 1) {
          return; // 错列行最右侧元素隐去
        }
        minX = Math.min(minX, x);
        minY = Math.min(minY, y);
        maxX = Math.max(maxX, x);
        maxY = Math.max(maxY, y);
        hexTiles.push(
          new Polyline({
            pos: [x + originPixelX, y + originPixelY],
            points: rhombusVertexes,
            strokeColor: 'rgba(0, 0, 0, 0.5)',
            lineWidth,
            close: true,
          })
        );
      });
      minY -= tileHeight / 2;
      minX -= tileWidth / 2;
      maxY += tileHeight / 2;
      maxX += tileWidth / 2;
      shapesEls.push(
        // 坐标系原点
        new Polyline({
          pos: [originPixelX, originPixelY],
          points: [0, 0, lineWidth, 0],
          strokeColor: 'red',
          lineWidth,
          close: true,
        }),
        new Label({
          pos: [30, 310],
          text: '↓ 中心点为原点的错列带边框的倒序菱形网格图',
        }),
        // 边框
        new Polyline({
          pos: [originPixelX, originPixelY],
          points: [
            [minX, minY],
            [minX, maxY],
            [maxX, maxY],
            [maxX, minY],
          ],
          strokeColor: 'rgba(0, 0, 0, 0.2)',
          lineWidth,
          close: true,
        }),
        ...hexTiles,
      );
      
      // 等距带边框的网格
      originPixelX = 540;
      originPixelY = 420;
      minX = Infinity;
      minY = Infinity;
      maxX = -Infinity;
      maxY = -Infinity;
      hexTiles = getIsometricPositions([-2, 2], [-2, 2], size, 'RightDown').map(([x, y]) => {
        minX = Math.min(minX, x);
        minY = Math.min(minY, y);
        maxX = Math.max(maxX, x);
        maxY = Math.max(maxY, y);
        return new Polyline({
          pos: [x + originPixelX, y + originPixelY],
          points: rhombusVertexes,
          strokeColor: 'rgba(0, 0, 0, 0.5)',
          lineWidth,
          close: true,
        });
      });
      minY -= tileHeight / 2;
      minX -= tileWidth / 2;
      maxY += tileHeight / 2;
      maxX += tileWidth / 2;
      shapesEls.push(
        // 坐标系原点
        new Polyline({
          pos: [originPixelX, originPixelY],
          points: [0, 0, lineWidth, 0],
          strokeColor: 'red',
          lineWidth,
          close: true,
        }),
        new Label({
          pos: [originPixelX - 150, 310],
          text: '↓ 等距带边框的网格',
        }),
        // 边框
        new Polyline({
          pos: [originPixelX, originPixelY],
          points: [
            [minX, minY],
            [minX, maxY],
            [maxX, maxY],
            [maxX, minY],
          ],
          strokeColor: 'rgba(0, 0, 0, 0.2)',
          lineWidth,
          close: true,
        }),
        ...hexTiles,
      );
      /* 图形处理试验代码 end */

      layer.append(...shapesEls);
    }());
  </script>


  <h1>鼠标交互示例-错列布局<em>(按菱形顶面定位，包含错列边角修正)</em></h1>
  <div id="container2"></div>
  <script type="text/javascript">
    (function() {
      const container = document.getElementById('container2');
      const {Scene, Label, Polyline} = spritejs;
      const scene = new Scene({
          container,
          width: 1000,
          height: 400,
          mode: 'static',
      });
      const layer = scene.layer('def', { handleEvent: false });
      const lineWidth = 2;

      const shapesEls = [];

      /* 图形处理试验代码 sta */

      const originPixelX = 390;
      const originPixelY = 180;
      const pos = [originPixelX, originPixelY];
      const tileWidth = 70;
      const tileHeight = 32;
      const size = [tileWidth, tileHeight];
      const anchor = [0.5, 0.5];
      const fontSize = '14px';
      const stagger = 'odd';

      const { getVertexes, getPositions, getInfoByPos } = qtiled.shapes.rhombus;

      /*const { getVertexes: getRectVertexes } = qtiled.shapes.rect;
      // 一个菱形顶点坐标集
      const rectVertexes = getRectVertexes(size);
      const rectEl = new Polyline({
        pos,
        points: rectVertexes,
        strokeColor: 'rgba(0, 0, 0, 0.5)',
        lineWidth,
        close: true,
      });
      shapesEls.push(rectEl);*/

      // 一个菱形顶点坐标集
      const rhombusVertexes = getVertexes(size);

      // 文案输出
      const mouseMoveLabel = new Label({
        pos: [30, 10],
        text:  '选中元素文案展示在这里',
        fontSize,
        fillColor: '#999',
      });
      shapesEls.push(mouseMoveLabel);

      const gridXRange = [-5, 5];
      const gridYRange = [-8, 11];
      let focusPos = pos;
      let focusText = '';
      getPositions(gridXRange, gridYRange, size, 'RightDown', stagger).forEach(([x, y, gridX, gridY]) => {
        const pos = [x + originPixelX, y + originPixelY];
        const text = gridX + ',' + gridY;
        if (!focusText) {
          focusText = text;
          focusPos = pos;
        }
        shapesEls.push(
          new Polyline({
            pos,
            points: rhombusVertexes,
            strokeColor: 'rgba(0, 0, 0, 0.2)',
            fillColor: 'rgba(255, 255, 255, 0.5)',
            lineWidth,
            close: true,
          }),
          new Label({
            anchor,
            pos,
            text,
            fontSize,
          })
        );
      });

      // 焦点矩形
      const focusRhombusTile = new Polyline({
        pos: focusPos,
        points: rhombusVertexes,
        strokeColor: 'rgba(0, 136, 0, 0.8)',
        lineWidth,
        close: true,
      });
      const focusRhombusLabel = new Label({
        anchor,
        pos: focusPos,
        text: focusText,
        fontSize,
        fillColor: 'rgba(0, 136, 0, 0.8)',
      });
      shapesEls.push(focusRhombusTile, focusRhombusLabel);

      const { offsetTop, offsetLeft } = container;
      container.addEventListener('mousemove', (e) => {
        const offsetX = e.pageX - offsetLeft;
        const offsetY = e.pageY - offsetTop;

        // 得到焦点元素索引及渲染坐标
        const [gridX, gridY, x, y] = getInfoByPos([offsetX, offsetY], pos, size, stagger)

        // 更新文案
        mouseMoveLabel.text = `gridX: ${gridX}, gridY: ${gridY}, x: ${x}, y:${y}，offsetX: ${offsetX}, offsetY: ${offsetY}`;

        // 越界与未越界颜色区分
        const color = `rgba(${gridX < gridXRange[0] || gridX > gridXRange[1] || gridY < gridYRange[0] || gridY > gridYRange[1] ? '255, 0' : '0, 136'}, 0, 0.8)`
        // 更新焦点区域标识位置
        focusRhombusTile.attr({ x, y, strokeColor: color });
        // rectEl.attr({ x, y });
        focusRhombusLabel.attr({ x, y, text: `${gridX},${gridY}`, fillColor: color });
      });

      layer.append(...shapesEls);
    }());
  </script>

  <h1>鼠标交互示例-等距布局<em>(基于等距定位判定，相对错列交互定位准确)</em></h1>

  <h1>鼠标交互示例-错列转等距<em>(保持错列布局的高UI利用率，等距布局的鼠标交互准确度)</em></h1>
  <div id="container4"></div>
  <script type="text/javascript">
    (function() {
      const container = document.getElementById('container4');
      const {Scene, Label, Polyline} = spritejs;
      const scene = new Scene({
          container,
          width: 1000,
          height: 400,
          mode: 'static',
      });
      const layer = scene.layer('def', { handleEvent: false });
      const lineWidth = 2;

      const shapesEls = [];

      /* 图形处理试验代码 sta */

      const originPixelX = 390;
      const originPixelY = 180;
      const pos = [originPixelX, originPixelY];
      const tileWidth = 70;
      const tileHeight = 32;
      const size = [tileWidth, tileHeight];
      const anchor = [0.5, 0.5];
      const fontSize = '14px';
      const stagger = 'odd';

      const { getVertexes, getPositions, getIsometricInfoByPos } = qtiled.shapes.rhombus;

      // 一个菱形顶点坐标集
      const rhombusVertexes = getVertexes(size);

      // 文案输出
      const mouseMoveLabel = new Label({
        pos: [30, 10],
        text:  '选中元素文案展示在这里',
        fontSize,
        fillColor: '#999',
      });
      shapesEls.push(mouseMoveLabel);

      const gridXRange = [-5, 5];
      const gridYRange = [-8, 11];
      let focusPos = pos;
      let focusText = '';
      const xyNumsMap = {};
      getPositions(gridXRange, gridYRange, size, 'RightDown', stagger).forEach(([x, y/*, gridX, gridY*/]) => {
        const pos = [x + originPixelX, y + originPixelY];
        const [gridX, gridY] = getIsometricInfoByPos(pos, [originPixelX, originPixelY], size);
        const text = gridX + ',' + gridY;
        xyNumsMap[text] = true;
        if (!focusText) {
          focusText = text;
          focusPos = pos;
        }
        shapesEls.push(
          new Polyline({
            pos,
            points: rhombusVertexes,
            strokeColor: 'rgba(0, 0, 0, 0.2)',
            fillColor: 'rgba(255, 255, 255, 0.5)',
            lineWidth,
            close: true,
          }),
          new Label({
            anchor,
            pos,
            text,
            fontSize,
          })
        );
      });

      // 焦点矩形
      const focusRhombusTile = new Polyline({
        pos: focusPos,
        points: rhombusVertexes,
        strokeColor: 'rgba(0, 136, 0, 0.8)',
        lineWidth,
        close: true,
      });
      const focusRhombusLabel = new Label({
        anchor,
        pos: focusPos,
        text: focusText,
        fontSize,
        fillColor: 'rgba(0, 136, 0, 0.8)',
      });
      shapesEls.push(focusRhombusTile, focusRhombusLabel);


      const { offsetTop, offsetLeft } = container;
      container.addEventListener('mousemove', (e) => {
        const offsetX = e.pageX - offsetLeft;
        const offsetY = e.pageY - offsetTop;

        // 得到焦点元素索引及渲染坐标
        const [gridX, gridY, x, y] = getIsometricInfoByPos([offsetX, offsetY], pos, size);

        // 更新文案
        mouseMoveLabel.text = `gridX: ${gridX}, gridY: ${gridY}, x: ${x}, y:${y}，offsetX: ${offsetX}, offsetY: ${offsetY}`;

        // 越界与未越界颜色区分
        const color = `rgba(${xyNumsMap[gridX+','+gridY] ? '0, 136' : '255, 0'}, 0, 0.8)`
        // 更新焦点区域标识位置
        focusRhombusTile.attr({ x, y, strokeColor: color });
        focusRhombusLabel.attr({ x, y, text: `${gridX},${gridY}`, fillColor: color });
      });

      layer.append(...shapesEls);
    }());
  </script>
