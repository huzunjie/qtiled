<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>菱形海拔示例</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./static/css/index.css?20260924105137">
  <style>
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .comparison { display: flex; flex-wrap: wrap; gap: 16px; }
    figure { flex: 1 1 360px; margin: 0; border: 1px solid #ddd; background: #fafafa; }
    figcaption { padding: 12px; font-weight: bold; }
    p { line-height: 1.7; }
  </style>
</head>
<body>
  <script src="./static/js/navs.js?20260924105137"></script>
  <script src="./static/js/spritejs3.js?20260924105137"></script>
  <script src="./static/js/qtiled.dev.js?20260924105137"></script>
  <script src="./static/js/pointer.js?20260924105137"></script>
  <main>
    <h1>菱形海拔示例</h1>
    <p>每单位海拔上移 16px，负值下移。下方谷地海拔为 0～−3，右侧高地海拔为 0～3；蓝色越深谷地越低，绿色越深高地越高，半透明白色表示海拔 0。</p>
    <h2>错列布局（odd）</h2>
    <div class="comparison">
      <figure>
        <figcaption>海拔位移</figcaption>
        <div id="staggered"></div>
      </figure>
    </div>
  <script>
    (function() {
      const { getPosition, getPositions, getInfoByPos, getInfoByPosWithElevation, getVertexes } = qtiled.shapes.rhombus;
      const gridXRange = [0, 10];
      const gridYRange = [0, 19];
      // 范围内默认海拔为 0，只记录非零海拔覆盖值。
      const elevations = {
        '1,0': 1, '4,0': -1,
        '3,1': 1, '5,1': 1,
        '2,2': 1, '3,2': 1,
        '1,3': -1, '4,3': 1, '5,3': -1,
        '3,4': -1, '5,4': 1,
        // 下方谷地由外向内逐级降低；错列行距较小，纵向留出更多空间。
        '0,7': -1, '1,7': -1, '2,7': -1, '3,7': -1, '4,7': -1,
        '0,8': -1, '1,8': -2, '2,8': -2, '3,8': -2, '4,8': -1,
        '0,9': -1, '1,9': -2, '2,9': -2, '3,9': -2, '4,9': -1,
        '0,10': -1, '1,10': -2, '2,10': -3, '3,10': -2, '4,10': -1,
        '0,11': -1, '1,11': -2, '2,11': -3, '3,11': -2, '4,11': -1,
        '0,12': -1, '1,12': -2, '2,12': -3, '3,12': -2, '4,12': -1,
        '0,13': -1, '1,13': -2, '2,13': -2, '3,13': -2, '4,13': -1,
        '0,14': -1, '1,14': -2, '2,14': -2, '3,14': -2, '4,14': -1,
        '0,15': -1, '1,15': -1, '2,15': -1, '3,15': -1, '4,15': -1,
        // 右侧高地从左到右逐级升高，外围默认海拔为 0。
        '6,5': 1, '7,5': 2, '8,5': 3,
        '6,6': 1, '7,6': 2, '8,6': 3,
        '6,7': 1, '7,7': 2, '8,7': 3,
        '6,8': 1, '7,8': 2, '8,8': 3,
        '6,9': 1, '7,9': 2, '8,9': 3,
      };
      // 沿用 rhombus.html 静态示例的单元格尺寸。
      const tileWidth = 60;
      const tileHeight = 30;
      const tileSize = [tileWidth, tileHeight];
      const { Scene, Label, Polyline } = spritejs;
      const colors = {
        '-3': '#7fb8df', '-2': '#a7d1ec', '-1': '#cce7f5',
        0: 'rgba(255, 255, 255, 0.5)',
        1: '#c6e7c8', 2: '#a3d5a6', 3: '#7dbd82',
      };
      const points = getVertexes(tileSize);
      const stagger = 'odd';
      const originPixel = [60, 90];
      // 海拔集合只计算一次，用于从高到低反查。
      const elevationLayers = [...new Set([0, ...Object.values(elevations)])]
        .sort((a, b) => b - a);
      const canvasWidth = 800;
      const canvasHeight = 440;
      // 批量坐标方法生成范围内的格子，并保持其遍历顺序。
      const cells = getPositions(gridXRange, gridYRange, tileSize, 'RightDown', stagger)
        .map(([, , gridX, gridY]) => {
          const elevation = elevations[`${gridX},${gridY}`] ?? 0;
          const [x, y] = getPosition([gridX, gridY], tileSize, stagger, originPixel, elevation);
          return { gridX, gridY, elevation, pos: [x, y] };
        })
        .sort((a, b) => a.elevation - b.elevation);

      const container = document.getElementById('staggered');
      container.style.width = `${canvasWidth}px`;
      container.style.height = `${canvasHeight}px`;
      const scene = new Scene({ container, width: canvasWidth, height: canvasHeight, mode: 'static' });
      const layer = scene.layer('def', { handleEvent: false });
      const shapesEls = [];
      const cellsByCoord = new Map();
      // cells 已按海拔排好顺序，绘制与查询索引使用同一份对象。
      cells.forEach(cell => {
        const { gridX, gridY, elevation, pos } = cell;
        const tile = new Polyline({
          pos,
          points,
          fillColor: colors[elevation],
          strokeColor: 'rgba(0, 0, 0, 0.5)',
          lineWidth: 2,
          close: true,
        });
        cellsByCoord.set(`${gridX},${gridY}`, cell);
        shapesEls.push(
          tile,
          new Label({
            pos,
            anchor: [0.5, 0.5],
            text: `${gridX},${gridY} h:${elevation}`,
            fontSize: '10px',
            fillColor: '#263238',
          }),
        );
      });
      // 独立焦点沿用 rhombus.html 的轮廓与文字，原瓦片保持不变。
      let selectedCell = cellsByCoord.get('0,0');
      const focusRhombusTile = new Polyline({
        pos: selectedCell.pos,
        points,
        strokeColor: 'rgba(0, 136, 0, 0.8)',
        lineWidth: 2,
        close: true,
      });
      const focusRhombusLabel = new Label({
        pos: selectedCell.pos,
        anchor: [0.5, 0.5],
        text: '0,0 h:0',
        fontSize: '10px',
        fillColor: 'rgba(0, 136, 0, 0.8)',
      });
      const mouseMoveLabel = new Label({
        pos: [20, 10],
        text: '移动鼠标查看坐标与海拔',
        fontSize: '13px',
        fillColor: '#999',
      });
      layer.append(...shapesEls, mouseMoveLabel, focusRhombusTile, focusRhombusLabel);

      // 每层只检查反查得到的格子；索引只含范围内的格子。
      function getFocusInfo(pixelX, pixelY) {
        const [gridX, gridY, x, y, elevation] = getInfoByPosWithElevation(
          [pixelX, pixelY], elevationLayers,
          ([gridX, gridY]) => cellsByCoord.get(`${gridX},${gridY}`)?.elevation,
          pixel => getInfoByPos(pixel, originPixel, tileSize, stagger),
        );
        // 未命中时复用海拔 0 的参考位置，null 表示并非实际顶面。
        return elevation === null ? { gridX, gridY, pos: [x, y], elevation } : cellsByCoord.get(`${gridX},${gridY}`);
      }
      container.addEventListener('mousemove', (event) => {
        const [offsetX, offsetY] = getPointerPosition(event, container);
        const focus = getFocusInfo(offsetX, offsetY);
        const { gridX, gridY, elevation, pos: [x, y] } = focus;
        const hit = elevation !== null;
        const color = `rgba(${hit ? '0, 136' : '255, 0'}, 0, 0.8)`;
        mouseMoveLabel.text = `gridX: ${gridX} / gridY: ${gridY} / ${hit ? `elevation: ${elevation}` : '未命中（海拔 0 平面参考）'} / x: ${x}, y: ${y} / offsetX: ${offsetX}, offsetY: ${offsetY}`;
        if (focus === selectedCell) return;
        selectedCell = focus;
        focusRhombusTile.attr({ x, y, strokeColor: color });
        focusRhombusLabel.attr({ x, y, text: `${gridX},${gridY}${hit ? ` h:${elevation}` : ''}`, fillColor: color });
      });
    }());
  </script>
    <h2>等距布局</h2>
    <div class="comparison">
      <figure>
        <figcaption>海拔位移</figcaption>
        <div id="isometric"></div>
      </figure>
    </div>
  <script>
    (function() {
      const { getIsometricPosition, getIsometricPositions, getIsometricInfoByPos, getInfoByPosWithElevation, getVertexes } = qtiled.shapes.rhombus;
      const gridXRange = [0, 8];
      const gridYRange = [0, 10];
      // 范围内默认海拔为 0，只记录非零海拔覆盖值。
      const elevations = {
        '1,0': 1, '4,0': -1,
        '3,1': 1, '5,1': 1,
        '2,2': 1, '3,2': 1,
        '1,3': -1, '4,3': 1, '5,3': -1,
        '3,4': -1, '5,4': 1,
        // 下方谷地由外向内逐级降低，外围默认海拔为 0。
        '0,6': -1, '1,6': -1, '2,6': -1, '3,6': -1, '4,6': -1,
        '0,7': -1, '1,7': -2, '2,7': -2, '3,7': -2, '4,7': -1,
        '0,8': -1, '1,8': -2, '2,8': -3, '3,8': -2, '4,8': -1,
        '0,9': -1, '1,9': -2, '2,9': -2, '3,9': -2, '4,9': -1,
        '0,10': -1, '1,10': -1, '2,10': -1, '3,10': -1, '4,10': -1,
        // 右侧高地从左到右逐级升高，外围默认海拔为 0。
        '6,5': 1, '7,5': 2, '8,5': 3,
        '6,6': 1, '7,6': 2, '8,6': 3,
        '6,7': 1, '7,7': 2, '8,7': 3,
        '6,8': 1, '7,8': 2, '8,8': 3,
        '6,9': 1, '7,9': 2, '8,9': 3,
      };
      // 沿用 rhombus.html 静态示例的单元格尺寸。
      const tileWidth = 60;
      const tileHeight = 30;
      const tileSize = [tileWidth, tileHeight];
      const { Scene, Label, Polyline } = spritejs;
      const colors = {
        '-3': '#7fb8df', '-2': '#a7d1ec', '-1': '#cce7f5',
        0: 'rgba(255, 255, 255, 0.5)',
        1: '#c6e7c8', 2: '#a3d5a6', 3: '#7dbd82',
      };
      const points = getVertexes(tileSize);
      const originPixel = [100, 180];
      // 海拔集合只计算一次，用于从高到低反查。
      const elevationLayers = [...new Set([0, ...Object.values(elevations)])]
        .sort((a, b) => b - a);
      const canvasWidth = 800;
      const canvasHeight = 400;
      // 批量坐标方法生成范围内的格子，并保持其遍历顺序。
      const cells = getIsometricPositions(gridXRange, gridYRange, tileSize, 'RightDown')
        .map(([, , gridX, gridY]) => {
          const elevation = elevations[`${gridX},${gridY}`] ?? 0;
          const [x, y] = getIsometricPosition([gridX, gridY], tileSize, originPixel, elevation);
          return { gridX, gridY, elevation, pos: [x, y] };
        })
        .sort((a, b) => a.elevation - b.elevation);

      const container = document.getElementById('isometric');
      container.style.width = `${canvasWidth}px`;
      container.style.height = `${canvasHeight}px`;
      const scene = new Scene({ container, width: canvasWidth, height: canvasHeight, mode: 'static' });
      const layer = scene.layer('def', { handleEvent: false });
      const shapesEls = [];
      const cellsByCoord = new Map();
      // cells 已按海拔排好顺序，绘制与查询索引使用同一份对象。
      cells.forEach(cell => {
        const { gridX, gridY, elevation, pos } = cell;
        const tile = new Polyline({
          pos,
          points,
          fillColor: colors[elevation],
          strokeColor: 'rgba(0, 0, 0, 0.5)',
          lineWidth: 2,
          close: true,
        });
        cellsByCoord.set(`${gridX},${gridY}`, cell);
        shapesEls.push(
          tile,
          new Label({
            pos,
            anchor: [0.5, 0.5],
            text: `${gridX},${gridY} h:${elevation}`,
            fontSize: '10px',
            fillColor: '#263238',
          }),
        );
      });
      // 独立焦点沿用 rhombus.html 的轮廓与文字，原瓦片保持不变。
      let selectedCell = cellsByCoord.get('0,0');
      const focusRhombusTile = new Polyline({
        pos: selectedCell.pos,
        points,
        strokeColor: 'rgba(0, 136, 0, 0.8)',
        lineWidth: 2,
        close: true,
      });
      const focusRhombusLabel = new Label({
        pos: selectedCell.pos,
        anchor: [0.5, 0.5],
        text: '0,0 h:0',
        fontSize: '10px',
        fillColor: 'rgba(0, 136, 0, 0.8)',
      });
      const mouseMoveLabel = new Label({
        pos: [20, 10],
        text: '移动鼠标查看坐标与海拔',
        fontSize: '13px',
        fillColor: '#999',
      });
      layer.append(...shapesEls, mouseMoveLabel, focusRhombusTile, focusRhombusLabel);

      // 每层只检查反查得到的格子；索引只含范围内的格子。
      function getFocusInfo(pixelX, pixelY) {
        const [gridX, gridY, x, y, elevation] = getInfoByPosWithElevation(
          [pixelX, pixelY], elevationLayers,
          ([gridX, gridY]) => cellsByCoord.get(`${gridX},${gridY}`)?.elevation,
          pixel => getIsometricInfoByPos(pixel, originPixel, tileSize),
        );
        // 未命中时复用海拔 0 的参考位置，null 表示并非实际顶面。
        return elevation === null ? { gridX, gridY, pos: [x, y], elevation } : cellsByCoord.get(`${gridX},${gridY}`);
      }
      container.addEventListener('mousemove', (event) => {
        const [offsetX, offsetY] = getPointerPosition(event, container);
        const focus = getFocusInfo(offsetX, offsetY);
        const { gridX, gridY, elevation, pos: [x, y] } = focus;
        const hit = elevation !== null;
        const color = `rgba(${hit ? '0, 136' : '255, 0'}, 0, 0.8)`;
        mouseMoveLabel.text = `gridX: ${gridX} / gridY: ${gridY} / ${hit ? `elevation: ${elevation}` : '未命中（海拔 0 平面参考）'} / x: ${x}, y: ${y} / offsetX: ${offsetX}, offsetY: ${offsetY}`;
        if (focus === selectedCell) return;
        selectedCell = focus;
        focusRhombusTile.attr({ x, y, strokeColor: color });
        focusRhombusLabel.attr({ x, y, text: `${gridX},${gridY}${hit ? ` h:${elevation}` : ''}`, fillColor: color });
      });
    }());
  </script>
    <p>移动鼠标可查询海拔图中的单元格，绿色焦点表示命中顶面，红色焦点表示未命中并展示海拔 0 平面参考位置。海拔图按高度从低到高绘制，同高度保持数据顺序；本页不提供坡面。</p>
  </main>
</body>
</html>
