<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>正矩形 查找相邻Tile</title>
  <meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1, maximum-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" type="text/css" href="./static/css/index.css?20260925152548">
  <link rel="stylesheet" type="text/css" href="./static/css/pathfinding.css?20260925152548">
  <link rel="stylesheet" href="./static/css/tile-selection.css?20260925152548">
</head>
<body>

  <script src="./static/js/navs.js?20260925152548"></script>
  <script src="./static/js/spritejs3.js?20260925152548"></script>
  <script src="./static/js/qtiled.dev.js?20260925152548"></script>
  <script src="./static/js/pointer.js?20260925152548"></script>
  <script src="./static/js/tile-selection.js?20260925152548"></script>

  <h1>相邻tile</h1>
  <div class="ipts">
    邻居距离：<input type="range" step="1" max="6" id="ipt_range1" value="1" />
    <span id="val1">1</span>
  </div>
  <div id="container"></div>
  <script type="text/javascript">
    (function() {
      const container = document.getElementById('container');
      const {Scene, Label, Polyline} = spritejs;
      const scene = new Scene({
          container,
          width: 800,
          height: 500,
          mode: 'static',
      });
      const layer = scene.layer('def', { handleEvent: false });
      const lineWidth = 2;
      const shapesEls = [];

      /* 图形处理试验代码 sta */

      const originPixelX = 345;
      const originPixelY = 200;
      const pos = [originPixelX, originPixelY];
      const tileWidth = 50;
      const tileHeight = 40;
      const size = [tileWidth, tileHeight];
      const anchor = [0.5, 0.5];
      const fontSize = '14px';

      const { getVertexes, getPosition, getPositions, directions, corners } = qtiled.shapes.rect;

      // 一个矩形顶点坐标集
      const rectVertexes = getVertexes(size);

      const gridXRange = [-6, 6];
      const gridYRange = [-4, 5];
      getPositions(gridXRange, gridYRange, size, 'RightDown').forEach(([x, y, gridX, gridY]) => {
        const pos = [x + originPixelX, y + originPixelY];
        shapesEls.push(
          new Polyline({
            pos,
            points: rectVertexes,
            strokeColor: 'rgba(0, 0, 0, 0.2)',
            fillColor: 'rgba(255, 255, 255, 0.5)',
            lineWidth,
            close: true,
          }),
          new Label({
            anchor,
            pos,
            text:  gridX + ',' + gridY,
            fontSize,
          })
        );
      });

      // 焦点矩形
      const focusRectTile = new Polyline({
        pos,
        points: rectVertexes,
        strokeColor: 'rgba(0, 136, 0, 0.9)',
        lineWidth,
        close: true,
      });
      const focusRectLabel = new Label({
        anchor,
        pos,
        text:  '0,0',
        fontSize,
        fillColor: 'rgba(0, 136, 0, 0.8)',
      });


      const neighborsEls = [];
      // 四个边的邻居
      directions.forEach((xyNum, i) => {
        neighborsEls.push(
          new Polyline({
            pos: getPosition(xyNum, size, pos),
            points: rectVertexes,
            strokeColor: 'rgba(0, 0, 255, 0.5)',
            fillColor: 'rgba(0, 0, 255, 0.05)',
            lineWidth,
            close: true,
          })
        );
      });
      // 四个角的邻居
      corners.forEach((xyNum, i) => {
        neighborsEls.push(
          new Polyline({
            pos: getPosition(xyNum, size, pos),
            points: rectVertexes,
            strokeColor: 'rgba(125, 0, 255, 0.5)',
            fillColor: 'rgba(125, 0, 255, 0.05)',
            lineWidth,
            close: true,
          })
        );
      });
      let neiDis = 1;
      let neiX = originPixelX;
      let neiY = originPixelY;
      const neiEls = [];
      const addEl = (xyNum, tmp) => {
        if (tmp[xyNum[0] + ',' + xyNum[1]]) return;
        neiEls.push(
          new Polyline({
            pos: getPosition(xyNum, size, pos),
            points: rectVertexes,
            strokeColor: 'rgba(0, 0, 0, 0.2)',
            fillColor: 'rgba(0, 0, 0, 0.08)',
            lineWidth,
            close: true,
          })
        );
      };
      const updateNeisPos = (x, y, dis = 1) => {
        neiX = x;
        neiY = y;
        neiDis = dis;
        const tmp = {};
        // 邻居位置更新
        [...corners, ...directions].forEach(([originPixelX, originPixelY], i) => {
          const xyNum = [originPixelX * dis, originPixelY * dis];
          tmp[xyNum[0] + ',' + xyNum[1]] = 1;
          const [x, y] = getPosition(xyNum, size, [neiX, neiY]);
          neighborsEls[i].attr({ x, y });
        });
        neiEls.forEach((el) => el.remove());
        neiEls.length = 0;
        for (let i = -dis; i < dis; i++) {
          addEl([dis, i], tmp);
          addEl([-dis, i], tmp);
          addEl([i, -dis], tmp);
          addEl([i, dis], tmp);
        }
        layer.append(...neiEls);
      };

      const valEl = document.getElementById('val1');
      document.getElementById('ipt_range1').onchange = (e) => {
        const val = e.target.value;
        valEl.innerText = val;
        updateNeisPos(neiX, neiY, Number(val));
      };
      
      shapesEls.push(...neighborsEls, focusRectTile, focusRectLabel);

      /* 图形处理试验代码 end */

      layer.append(...shapesEls);
    }());
  </script>


  <h1>查找相邻tile</h1>
  <div id="container3" class="container"></div>
  <script type="text/javascript">
    (function() {
      const container = document.getElementById('container3');
      const {Scene, Label, Polyline} = spritejs;
      const scene = new Scene({
          container,
          width: 800,
          height: 500,
          mode: 'static',
      });
      const layer = scene.layer('def', { handleEvent: false });
      const lineWidth = 2;
      const shapesEls = [];

      /* 图形处理试验代码 sta */

      const originPixelX = 280;
      const originPixelY = 180;
      const pos = [originPixelX, originPixelY];
      const tileWidth = 40;
      const tileHeight = 30;
      const size = [tileWidth, tileHeight];
      const anchor = [0.5, 0.5];
      const fontSize = '12px';

      const { getVertexes, getPosition, getPositions, getInfoByPos, getNeighborsByDistance } = qtiled.shapes.rect;

      // 一个矩形顶点坐标集
      const rectVertexes = getVertexes(size);

      const gridXRange = [-6, 6];
      const gridYRange = [-4, 5];
      getPositions(gridXRange, gridYRange, size, 'RightDown').forEach(([x, y, gridX, gridY]) => {
        const pos = [x + originPixelX, y + originPixelY];
        shapesEls.push(
          new Polyline({
            pos,
            points: rectVertexes,
            strokeColor: 'rgba(0, 0, 0, 0.2)',
            fillColor: 'rgba(255, 255, 255, 0.5)',
            lineWidth,
            close: true,
          }),
          new Label({
            anchor,
            pos,
            text:  gridX + ',' + gridY,
            fontSize,
          })
        );
      });

      // 焦点矩形
      const focusXYNum = [0, 0];
      const focusRectTile = new Polyline({
        pos,
        points: rectVertexes,
        strokeColor: 'rgba(0, 136, 0, 0.9)',
        lineWidth,
        close: true,
      });
      const focusRectLabel = new Label({
        anchor,
        pos,
        text:  '0,0',
        fontSize,
        fillColor: 'rgba(0, 136, 0, 0.8)',
      });
      // 邻居元素
      const neighborsEls = [];
      const selection = createTileSelection({
        container,
        getByOffsets: qtiled.shapes.rect.getNeighborsByOffsets,
        getByDistance: getNeighborsByDistance,
        onChange: () => updateNeis(),
      });
      const updateNeis = () => {
        neighborsEls.forEach((el) => el.remove());
        neighborsEls.length = 0;
        // 邻居位置更新
        selection.getNeighbors(focusXYNum).forEach((xyNum, i) => {
          const _pos = getPosition(xyNum, size, pos);
          neighborsEls.push(
            new Polyline({
              pos: _pos,
              points: rectVertexes,
              strokeColor: 'rgba(0, 0, 125, 0.2)',
              fillColor: 'rgba(0, 0, 125, 0.08)',
              lineWidth,
              close: true,
            }),
            new Label({
              anchor,
              pos: _pos,
              text: xyNum.join(','),
              fontSize,
              xyNum,
              fillColor: 'rgba(0, 136, 0, 0.8)',
            })
          );
        });
        layer.append(...neighborsEls);
      };

      updateNeis();
      
      container.addEventListener('mousemove', (e) => {
        // 得到索引序号&渲染位置
        const [gridX, gridY, x, y] = getInfoByPos(
          getPointerPosition(e, container),
          pos,
          size
        );

        // 同一格内移动无需重复计算选区或更新绘制属性。
        if (focusXYNum[0] === gridX && focusXYNum[1] === gridY) return;

        // 焦点下标索引
        focusXYNum[0] = gridX;
        focusXYNum[1] = gridY;

        // 更新焦点区域标识位置
        focusRectTile.attr({ x, y });
        focusRectLabel.attr({ x, y, text: `${gridX},${gridY}` });

        selection.getNeighbors(focusXYNum).forEach((xyNum, i) => {
          const _pos = getPosition(xyNum, size, pos);
          neighborsEls[i * 2].attr('pos', _pos);
          neighborsEls[i * 2 + 1].attr({ pos: _pos, text: xyNum.join(','), xyNum });
        });
      });
      shapesEls.push(...neighborsEls, focusRectTile, focusRectLabel);

      /* 图形处理试验代码 end */

      layer.append(...shapesEls);
    }());
  </script>
  
 
</body>
</html>
