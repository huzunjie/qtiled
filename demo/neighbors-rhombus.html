<body>

  <script src="./static/js/navs.js?20260921155206"></script>

  <h1>在错列布局中查找相邻Tile</h1>
  <div id="container" style="height: 350px;"></div>
  <script type="text/javascript">
    (function() {
      const container = document.getElementById('container');
      const {Scene, Label, Polyline} = spritejs;
      const scene = new Scene({
          container,
          width: 800,
          height: 350,
          mode: 'static',
      });
      const layer = scene.layer('def', { handleEvent: false });
      const lineWidth = 2;
      const shapesEls = [];

      /* 图形处理试验代码 sta */

      const originPixelX = 225; // 中心点位置
      const originPixelY = 160; // 中心点位置
      const pos = [originPixelX, originPixelY]; // 中心点位置
      const tileWidth = 60;
      const tileHeight = 30;
      const size = [tileWidth, tileHeight];
      const anchor = [0.5, 0.5];
      const fontSize = '14px';

      const { getVertexes, getPosition, getPositions, getNeighbors } = qtiled.shapes.rhombus;

      // 一个菱形顶点坐标集
      const tileVertexes = getVertexes(size);

      const gridXRange = [-3, 6];
      const gridYRange = [-8, 8];
      const stagger = 'even'; // odd even

      getPositions(gridXRange, gridYRange, size, 'RightDown', stagger).forEach(([x, y, gridX, gridY]) => {
        const pos = [x + originPixelX, y + originPixelY];
        shapesEls.push(
          new Polyline({
            pos,
            points: tileVertexes,
            strokeColor: 'rgba(0, 0, 0, 0.2)',
            fillColor: 'rgba(255, 255, 255, 0.5)',
            lineWidth,
            close: true,
          }),
          new Label({
            anchor,
            pos,
            text:  gridX + ',' + gridY,
            fontSize,
          })
        );
      });

      // 焦点菱形
      const createFocusAndNeis = (focusXYNum = [-3, -2]) => {
        const focusPos = getPosition(focusXYNum, size, stagger, pos);
        const focusRhombusTile = new Polyline({
          pos: focusPos,
          points: tileVertexes,
          strokeColor: 'rgba(0, 136, 0, 0.9)',
          lineWidth,
          close: true,
        });
        const focusRhombusLabel = new Label({
          anchor,
          pos: focusPos,
          text:  focusXYNum.join(),
          fontSize,
          fillColor: 'rgba(0, 136, 0, 0.8)',
        });

        const neighborsEls = [];
        getNeighbors(focusXYNum, stagger).map((xyNum) => {
          const nPos = getPosition(xyNum, size, stagger, pos);
          neighborsEls.push(
            new Polyline({
              pos: nPos,
              points: tileVertexes,
              strokeColor: 'rgba(0, 0, 255, 0.5)',
              fillColor: 'rgba(0, 0, 255, 0.05)',
              lineWidth,
              close: true,
            }),
            new Label({
              anchor,
              pos: nPos,
              text:  xyNum[0] + ',' + xyNum[1] ,
              fontSize,
              fillColor: 'rgba(0, 0, 255, 0.8)',
            })
          );
        });

        shapesEls.push(...neighborsEls, focusRhombusTile, focusRhombusLabel);
      };
      createFocusAndNeis([0, 0]);
      createFocusAndNeis([4, 1]);
      /* 图形处理试验代码 end */

      layer.append(...shapesEls);
    }());
  </script>

  <hr style="border-color: #fff;" />
  <h1 style="margin-top: 50px;">查找相邻tile - 错列布局</h1>
  <div class="ipts">
    邻居距离：<input type="range" step="1" max="6" id="ipt_dis_stagger" value="1" />
    <span id="val_stagger">1</span>
  </div>
  <div class="ipts">
    邻居类型：<select id="sei_type_stagger">
      <option value="all">全部</option>
      <option value="no_self">排除自己</option>
      <option value="border">命中区域几何图形边框</option>
      <option value="vertex">命中区域几何图形顶点</option>
      <option value="diamond">矩形范围内</option>
    </select>
  </div>
  <div id="container2" class="container" style="height: 500px;"></div>
  <script type="text/javascript">
    (function() {
      const container = document.getElementById('container2');
      const {Scene, Label, Polyline} = spritejs;
      const scene = new Scene({
          container,
          width: 800,
          height: 500,
          mode: 'static',
      });
      const layer = scene.layer('def', { handleEvent: false });
      const lineWidth = 2;
      const shapesEls = [];

      /* 图形处理试验代码 sta */

      const originPixelX = 225;
      const originPixelY = 200;
      const pos = [originPixelX, originPixelY];
      const tileWidth = 60;
      const tileHeight = 30;
      const size = [tileWidth, tileHeight];
      const anchor = [0.5, 0.5];
      const fontSize = '14px';

      const { getVertexes, getPosition, getPositions, getInfoByPos, getNeighbors, getNeighborsByDistance } = qtiled.shapes.rhombus;

      // 一个菱形顶点坐标集
      const tileVertexes = getVertexes(size);

      const gridXRange = [-3, 6];
      const gridYRange = [-8, 8];
      const stagger = 'even'; // odd even

      getPositions(gridXRange, gridYRange, size, 'RightDown', stagger).forEach(([x, y, gridX, gridY]) => {
        const pos = [x + originPixelX, y + originPixelY];
        shapesEls.push(
          new Polyline({
            pos,
            points: tileVertexes,
            strokeColor: 'rgba(0, 0, 0, 0.2)',
            fillColor: 'rgba(255, 255, 255, 0.5)',
            lineWidth,
            close: true,
          }),
          new Label({
            anchor,
            pos,
            text:  gridX + ',' + gridY,
            fontSize,
          })
        );
      });

      // 焦点菱形
      const focusXYNum = [1, 1];
      const focusPos = getPosition(focusXYNum, size, stagger, pos);
      const focusRhombusTile = new Polyline({
        pos: focusPos,
        points: tileVertexes,
        strokeColor: 'rgba(0, 136, 0, 0.9)',
        lineWidth,
        close: true,
      });
      const focusRhombusLabel = new Label({
        anchor,
        pos: focusPos,
        text:  focusXYNum.join(),
        fontSize,
        fillColor: 'rgba(0, 136, 0, 0.8)',
      });
      // 邻居元素
      const neighborsEls = [];
      const neighborsLabels = [];
      const disEl = document.getElementById('ipt_dis_stagger');
      const typeEl = document.getElementById('sei_type_stagger');

      const updateNeis = () => {
        const distance = Number(disEl.value);
        neighborsEls.forEach((el) => el.remove());
        neighborsEls.length = 0;
        neighborsLabels.forEach((label) => label.remove());
        neighborsLabels.length = 0;
        // 邻居位置更新
        getNeighborsByDistance(focusXYNum, distance, typeEl.value, stagger).forEach((xyNum, i) => {
          const _pos = getPosition(xyNum, size, stagger, pos);
          neighborsEls.push(
            new Polyline({
              pos: _pos,
              points: tileVertexes,
              strokeColor: 'rgba(0, 0, 255, 0.5)',
              fillColor: 'rgba(0, 0, 255, 0.05)',
              lineWidth,
              close: true,
            })
          );
          neighborsLabels.push(
            new Label({
              anchor,
              pos: _pos,
              text:  xyNum[0] + ',' + xyNum[1],
              fontSize,
              fillColor: 'rgba(0, 0, 255, 0.8)',
            })
          );
        });
        layer.append(...neighborsEls);
        layer.append(...neighborsLabels);
      };

      const valEl = document.getElementById('val_stagger');
      disEl.onchange = (e) => {
        valEl.innerText = e.target.value;
        updateNeis();
      };
      typeEl.onchange = updateNeis;
      updateNeis();
      
      const { offsetTop, offsetLeft } = container;
      container.addEventListener('mousemove', (e) => {
        // 得到索引序号&渲染位置
        const [gridX, gridY, x, y] = getInfoByPos(
          [e.pageX - offsetLeft, e.pageY - offsetTop],
          pos,
          size,
          stagger
        );

        // 焦点下标索引
        focusXYNum[0] = gridX;
        focusXYNum[1] = gridY;

        // 更新焦点区域标识位置
        focusRhombusTile.attr({ x, y });
        focusRhombusLabel.attr({ x, y, text: `${gridX},${gridY}` });

        // 邻居位置更新
        const distance = Number(disEl.value);
        getNeighborsByDistance(focusXYNum, distance, typeEl.value, stagger).forEach((xyNum, i) => {
          const _pos = getPosition(xyNum, size, stagger, pos);
          neighborsEls[i].attr('pos', _pos);
          neighborsLabels[i].attr('pos', _pos);
          neighborsLabels[i].attr('text', xyNum[0] + ',' + xyNum[1]);
        });
      });
      shapesEls.push(focusRhombusTile, focusRhombusLabel, ...neighborsEls);

      /* 图形处理试验代码 end */

      layer.append(...shapesEls);
    }());
  </script>

  <script type="text/javascript">

          text:  focusXYNum.join(),

  <div id="container3" class="container" style="height: 500px;"></div>
  <script type="text/javascript">
    (function() {
      const container = document.getElementById('container3');
      const {Scene, Label, Polyline} = spritejs;
      const scene = new Scene({
          container,
          width: 800,
          height: 500,
          mode: 'static',
      });
      const layer = scene.layer('def', { handleEvent: false });
      const lineWidth = 2;
      const shapesEls = [];

      /* 图形处理试验代码 sta */

      const originPixelX = 240;
      const originPixelY = 200;
      const pos = [originPixelX, originPixelY];
      const tileWidth = 60;
      const tileHeight = 30;
      const size = [tileWidth, tileHeight];
      const anchor = [0.5, 0.5];
      const fontSize = '14px';

      const renderOrder = 'RightDown'; // RightDown LeftDown LeftUp RightUp

      const { getVertexes, getIsometricPosition, getIsometricPositions, getIsometricInfoByPos, getIsometricNeighbors, getIsometricNeighborsByDistance } = qtiled.shapes.rhombus;

      // 一个菱形顶点坐标集
      const tileVertexes = getVertexes(size);

      const gridXRange = [-3, 6];
      const gridYRange = [-4, 6];

      getIsometricPositions(gridXRange, gridYRange, size, renderOrder).forEach(([x, y, gridX, gridY]) => {
        const pos = [x + originPixelX, y + originPixelY];
        shapesEls.push(
          new Polyline({
            pos,
            points: tileVertexes,
            strokeColor: 'rgba(0, 0, 0, 0.2)',
            fillColor: 'rgba(255, 255, 255, 0.5)',
            lineWidth,
            close: true,
          }),
          new Label({
            anchor,
            pos,
            text:  gridX + ',' + gridY,
            fontSize,
          })
        );
      });

      // 焦点菱形
      const focusXYNum = [0, 0];
      const focusRhombusTile = new Polyline({
        pos,
        points: tileVertexes,
        strokeColor: 'rgba(0, 136, 0, 0.9)',
        lineWidth,
        close: true,
      });
      const focusRhombusLabel = new Label({
        anchor,
        pos,
        text:  '0,0',
        fontSize,
        fillColor: 'rgba(0, 136, 0, 0.8)',
      });
      // 邻居元素
      const neighborsEls = [];
      const disEl = document.getElementById('ipt_dis_iso');
      const typeEl = document.getElementById('sei_type_iso');
      
      const updateNeis = () => {
        const distance = Number(disEl.value);
        neighborsEls.forEach((el) => el.remove());
        neighborsEls.length = 0;
        // 邻居位置更新
        getIsometricNeighborsByDistance(focusXYNum, distance, typeEl.value, renderOrder).forEach((xyNum, i) => {
          const _pos = getIsometricPosition(xyNum, size, pos);
          neighborsEls.push(
            new Polyline({
              pos: _pos,
              points: tileVertexes,
              strokeColor: 'rgba(0, 0, 255, 0.5)',
              fillColor: 'rgba(0, 0, 255, 0.05)',
              lineWidth,
              close: true,
            }),
            new Label({
              anchor,
              pos: _pos,
              text: xyNum.join(','),
              fontSize,
              xyNum: [xyNum[0] - focusXYNum[0], xyNum[1] - focusXYNum[1]],
              strokeColor: 'rgba(0, 0, 255, 0.5)',
            })
          );
        });
        layer.append(...neighborsEls);
      };

      const valEl = document.getElementById('val_iso');
      disEl.onchange = (e) => {
        valEl.innerText = e.target.value;
        updateNeis();
      };
      typeEl.onchange = updateNeis;
      updateNeis();
      
      const { offsetTop, offsetLeft } = container;
      container.addEventListener('mousemove', (e) => {
        // 得到索引序号&渲染位置
        const [gridX, gridY, x, y] = getIsometricInfoByPos(
          [e.pageX - offsetLeft, e.pageY - offsetTop],
          pos,
          size
        );

        // 焦点下标索引

        focusXYNum[1] = gridY;

        // 更新焦点区域标识位置

        getIsometricNeighborsByDistance(focusXYNum, distance, typeEl.value, renderOrder).forEach((xyNum, i) => {
          const _pos = getIsometricPosition(xyNum, size, pos);
          neighborsEls[i * 2].attr('pos', _pos);
          neighborsEls[i * 2 + 1].attr({ pos: _pos, text: xyNum.join(','), xyNum });
        });
      });
      shapesEls.push(focusRhombusTile, focusRhombusLabel, ...neighborsEls);

      /* 图形处理试验代码 end */

      layer.append(...shapesEls);
