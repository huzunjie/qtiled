<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>菱形海拔坐标对照</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./static/css/index.css?20260921155206">
  <style>
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .comparison { display: flex; flex-wrap: wrap; gap: 16px; }
    figure { flex: 1 1 360px; margin: 0; border: 1px solid #ddd; background: #fafafa; }
    figcaption { padding: 12px; font-weight: bold; }
    .canvas-container { width: 400px; height: 240px; }
    p { line-height: 1.7; }
  </style>
</head>
<body>
  <script src="./static/js/navs.js?20260921155206"></script>
  <script src="./static/js/spritejs3.js?20260921155206"></script>
  <script src="./static/js/qtiled.dev.js?20260921155206"></script>
  <main>
    <h1>菱形海拔坐标对照</h1>
    <p>相同网格、相同尺寸：左侧按平面绘制，右侧按标注海拔绘制。每单位海拔上移 16px，负值下移。颜色表示海拔：蓝色 −1、浅灰 0、绿色 1。</p>
    <h2>错列布局（odd）</h2>
    <div class="comparison" id="staggered"></div>
    <h2>等距布局</h2>
    <div class="comparison" id="isometric"></div>
    <p>本页仅验证坐标位移。海拔图按高度从低到高绘制，同高度保持数据顺序；不提供点击选中或坡面。</p>
  </main>
  <script>
    (function() {
      const { getPosition, getIsometricPosition, getVertexes } = qtiled.shapes.rhombus;
      // 固定演示数据：[网格 X, 网格 Y, 海拔]，两种布局和两侧对照共用。
      const cells = [
        [0, 0, 0], [1, 0, 1], [2, 0, 0], [3, 0, 0], [4, 0, -1], [5, 0, 0],
        [0, 1, 0], [1, 1, 0], [2, 1, 0], [3, 1, 1], [4, 1, 0], [5, 1, 1],
        [0, 2, 0], [1, 2, 0], [2, 2, 1], [3, 2, 1], [4, 2, 0], [5, 2, 0],
        [0, 3, 0], [1, 3, -1], [2, 3, 0], [3, 3, 0], [4, 3, 1], [5, 3, -1],
        [0, 4, 0], [1, 4, 0], [2, 4, 0], [3, 4, -1], [4, 4, 0], [5, 4, 1],
        [0, 5, 0], [1, 5, 0], [2, 5, 0], [3, 5, 0], [4, 5, 0], [5, 5, 0],
      ];
      // 沿用 rhombus.html 静态示例的单元格尺寸。
      const tileWidth = 60;
      const tileHeight = 30;
      const tileSize = [tileWidth, tileHeight];
      const { Scene, Label, Polyline } = spritejs;
      const colors = { '-1': '#cce7f5', 0: '#edf0f2', 1: '#c6e7c8' };
      const points = getVertexes(tileSize);
      function renderComparison(id, getCellPosition) {
        [false, true].forEach(elevated => {
          const figure = document.createElement('figure');
          const caption = document.createElement('figcaption');
          caption.textContent = elevated ? '海拔位移' : '平面参考（忽略海拔）';
          const container = document.createElement('div');
          container.className = 'canvas-container';
          figure.append(caption, container);
          document.getElementById(id).appendChild(figure);
          const scene = new Scene({ container, width: 400, height: 240, mode: 'static' });
          const layer = scene.layer('def', { handleEvent: false });
          const shapesEls = [];
          // 本页的顶面叠放规则：高海拔后绘制，顶面与文字作为一组。
          // 排序副本，避免改变平面参考图及另一种布局共用的数据。
          const renderCells = elevated ? cells.slice().sort((a, b) => a[2] - b[2]) : cells;
          renderCells.forEach(([gridX, gridY, elevation]) => {
            const [pixelX, pixelY] = getCellPosition([gridX, gridY], elevated ? elevation : 0);
            // 顶面与文字共用绘制坐标，不在页面内重新计算海拔偏移。
            const pos = [pixelX, pixelY];
            shapesEls.push(
              new Polyline({
                pos,
                points,
                fillColor: colors[elevation],
                strokeColor: 'rgba(0, 0, 0, 0.5)',
                lineWidth: 2,
                close: true,
              }),
              new Label({
                pos,
                anchor: [0.5, 0.5],
                text: `${gridX},${gridY} h:${elevation}`,
                fontSize: '10px',
                fillColor: '#263238',
              }),
            );
          });
          layer.append(...shapesEls);
        });
      }
      renderComparison('staggered', (gridCoord, elevation) => getPosition(gridCoord, tileSize, 'odd', [40, 80], elevation));
      renderComparison('isometric', (gridCoord, elevation) => getIsometricPosition(gridCoord, tileSize, [60, 120], elevation));
    }());
  </script>
</body>
</html>
