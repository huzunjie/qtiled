<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Path Finding 正矩形 寻路</title>
  <meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1, maximum-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" type="text/css" href="./static/css/index.css?20260925152548">
  <link rel="stylesheet" type="text/css" href="./static/css/pathfinding.css?20260925152548">
</head>
<body>

  <script src="./static/js/navs.js?20260925152548"></script>
  <script src="./static/js/spritejs3.js?20260925152548"></script>
  <script src="./static/js/qtiled.dev.js?20260925152548"></script>
  <script src="./static/js/pointer.js?20260925152548"></script>

  <h1>寻找连通路径</h1>
  <div id="container2"></div>
  <div class="frm-wrap">
    <div class="frm">
      <h4>可用方向：</h4>
      <span id="dirs" class="dirs">
        <a data-dir="corners">↖</a>
        <a data-dir="directions" class="active">↑</a>
        <a data-dir="corners">↗</a>
        <a data-dir="directions" class="active">←</a>
        <a disable>○</a>
        <a data-dir="directions" class="active">→</a>
        <a data-dir="corners">↙</a>
        <a data-dir="directions" class="active">↓</a>
        <a data-dir="corners">↘</a>
      </span>
      <label><input type="checkbox" id="ckb">网格外允许通行(无限查找，慎用！)</label>
      <span class="btns-submit">
        <a class="btn-big btn-clear" id="clear_path">清理路径</a>
        <a class="btn-big" id="start_path_finding"><b>开始寻路</b></a>
      </span>
    </div>
    <div class="frm frm-btns">
      <a class="btn-big btn-clear" id="clear_sta">清理起点</a>
      <a class="btn-big" id="set_sta">设置起点</a>
      <a class="btn-big btn-clear" id="clear_end">清理终点</a>
      <a class="btn-big" id="set_end">设置终点</a>
      <a class="btn-big btn-clear" id="clear_roadblock">清理路障</a>
      <a class="btn-big" id="set_roadblock">设置路障</a>
    </div>
  </div>
  <script type="text/javascript">
    (function() {
      const $id = (id) => document.getElementById(id);

      const container = $id('container2');
      const {Scene, Label, Polyline} = spritejs;
      const scene = new Scene({
          container,
          width: 1500,
          height: 500,
          mode: 'static',
      });
      const layer = scene.layer('def', { handleEvent: false });
      const lineWidth = 2;
      const shapesEls = [];

      /* 图形处理试验代码 sta */

      const originPixelX = 345;
      const originPixelY = 220;
      const pos = [originPixelX, originPixelY];
      const tileWidth = 50;
      const tileHeight = 40;
      const size = [tileWidth, tileHeight];
      const anchor = [0.5, 0.5];
      const fontSize = '12px';

      const { getVertexes, getPosition, getPositions, getInfoByPos } = qtiled.shapes.rect;

      // 一个矩形顶点坐标集
      const rectVertexes = getVertexes(size);

      // 文案输出
      const mouseMoveLabel = new Label({
        pos: [30, 10],
        text:  '鼠标交互实时展示',
        fontSize,
        fillColor: '#999',
      });
      shapesEls.push(mouseMoveLabel);

      const gridXRange = [-6, 6];
      const gridYRange = [-4, 6];
      getPositions(gridXRange, gridYRange, size, 'RightDown').forEach(([x, y, gridX, gridY]) => {
        const pos = [x + originPixelX, y + originPixelY];
        shapesEls.push(
          new Polyline({
            pos,
            points: rectVertexes,
            strokeColor: 'rgba(0, 0, 0, 0.1)',
            fillColor: 'rgba(255, 255, 255, 0.2)',
            lineWidth,
            close: true,
          }),
          new Label({
            anchor,
            pos,
            text:  gridX + ',' + gridY,
            fontSize,
            opacity: 0.4,
          })
        );
      });

      // 焦点矩形
      const focusRectTile = new Polyline({
        pos,
        points: rectVertexes,
        strokeColor: 'rgba(0, 136, 0, 0.9)',
        lineWidth,
        close: true,
      });
      const focusRectLabel = new Label({
        anchor,
        pos,
        text:  '0,0',
        fontSize,
        fillColor: 'rgba(0, 136, 0, 0.8)',
      });

      shapesEls.push(focusRectTile, focusRectLabel);

      /* 图形处理试验代码 end */

      container.addEventListener('mousemove', (e) => {
        const [pixelX, pixelY] = getPointerPosition(e, container);
        // 得到索引序号&渲染位置
        const [gridX, gridY, x, y] = getInfoByPos([pixelX, pixelY], pos, size);
        // 更新文案
        mouseMoveLabel.text = `gridX: ${gridX}, gridY: ${gridY}; pixelX: ${pixelX}, pixelY: ${pixelY}, x: ${x}, y:${y}`;
        
        // 越界与未越界颜色区分
        const color = `rgba(${gridX < gridXRange[0] || gridX > gridXRange[1] || gridY < gridYRange[0] || gridY > gridYRange[1] ? '255, 0' : '0, 136'}, 0, 0.3)`
        // 更新焦点区域标识位置
        focusRectTile.attr({ x, y, strokeColor: color });
        focusRectLabel.attr({ x, y, text: `${gridX},${gridY}`, fillColor: color });
      });

      layer.append(...shapesEls);

      // 寻路相关
      const layerRoad = scene.layer('roadblock', { handleEvent: false });
      const roadsRmCaches = {/* [gridX + ',' + gridY]: removeFunction*/};
      const clearPath = () => Object.values(roadsRmCaches).forEach((fun) => fun());

      // 创建tile块，并得到 append remove 方法
      const getBlock = (txt = '起点', color = 'blue', opacity = 1, txtYPos = 1.5, fillColor = 'rgba(255, 255, 255, 0.2)') => {
        const blockTile = new Polyline({
          pos,
          points: rectVertexes,
          strokeColor: color,
          fillColor,
          lineWidth,
          close: true,
          opacity,
        });
        const blockLabel = new Label({
          anchor: [0.5, txtYPos],
          pos,
          text:  txt,
          fontSize: '10px',
          fillColor: color,
        });
        let blockXNum = 0;
        let blockYNum = 0;
        return [
          // append
          (gridX, gridY, x, y) => {
            blockXNum = gridX;
            blockYNum = gridY;
            blockTile.attr({ x, y });
            blockLabel.attr({ x, y });
            layerRoad.append(blockTile, blockLabel);
          },
          // remove
          () => {
            blockXNum = 0;
            blockYNum = 0;
            blockTile.remove();
            blockLabel.remove();
          },
          // getXyNum
          () => [blockXNum, blockYNum],
        ];
      };

      let actFun = null;
      // 起点
      const [appendStaBlock, removeStaBlock, getStaXyNum] = getBlock('起点', 'rgba(0, 125, 255, 0.8)');
      $id('set_sta').onclick = () => {
        actFun = appendStaBlock;
        clearPath();
      };
      $id('clear_sta').onclick = removeStaBlock;
      // 终点
      const [appendEndBlock, removeEndBlock, getEndXyNum] = getBlock('终点', 'rgba(125, 0, 255, 0.8)');
      $id('set_end').onclick = () => {
        actFun = appendEndBlock;
        clearPath();
      };
      $id('clear_end').onclick = removeEndBlock;
      // 路障
      const roadblocksRmCaches = {/* [gridX + ',' + gridY]: removeFunction*/}; // 路障集
      const addRoadbock = (gridX, gridY, x, y) => {
        const cacheKey = gridX + ',' + gridY;
        if (roadblocksRmCaches[cacheKey]) return; // 阻止重复设置路障
        const [appendBlock, removeBlock] = getBlock('路障 ', 'rgba(0, 0, 0, 0.8)', 1, 1.5, 'rgba(0, 0, 0, 0.2)');
        appendBlock(gridX, gridY, x, y);
        roadblocksRmCaches[cacheKey] = () => {
          delete roadblocksRmCaches[cacheKey];
          removeBlock();
        };
      };
      $id('set_roadblock').onclick = () => {
        actFun = addRoadbock;
        clearPath();
      };
      $id('clear_roadblock').onclick = () => Object.values(roadblocksRmCaches).forEach((fun) => fun());

      // 点击瓦片，执行具体行为
      container.addEventListener('click', (e) => {
        if (!actFun) return;
        // 得到索引序号&渲染位置
        const [gridX, gridY, x, y] = getInfoByPos(getPointerPosition(e, container), pos, size);
        actFun(gridX, gridY, x, y);
      });

      // 方向控制
      const dirConfs = {};
      const dirBtnEls = Array.from($id('dirs').querySelectorAll('[data-dir]'));
      dirBtnEls.forEach((el) => {
        dirConfs[el.innerText] = el.className === 'active';
      });
      // 选中与取消某个方向
      dirBtnEls.forEach((el) => {
        el.onclick = () => {
          const hasActive = el.className === 'active';
          el.className = hasActive ? '' : 'active';
          dirConfs[el.innerText] = !hasActive;
        };
      });

      const { getNeighbors } = qtiled.shapes.rect;
      const { aStar } = qtiled.pathFinding;
      // 道路
      const addRoad = (gridX, gridY, x, y, cost = 0) => {
        const [appendBlock, removeBlock] = getBlock(`道路 ${cost}`, '#a28a0f', 0.5, -0.5, 'rgba(180, 140, 90, 0.2)');
        appendBlock(gridX, gridY, x, y);
        const cacheKey = gridX + ',' + gridY;
        roadsRmCaches[cacheKey] = () => {
          delete roadsRmCaches[cacheKey];
          removeBlock();
        };
      };

      const ckbEl = $id('ckb');
      const [minGridX, maxGridX] = gridXRange;
      const [minGridY, maxGridY] = gridYRange;
      // 校验是否合法可通行元素
      const tileVerify = (gridX, gridY) => (
        // 不是路障
        !roadblocksRmCaches[gridX + ',' + gridY]
        // 限定在网格地图区域内查找
        && (ckbEl.checked || (gridX >= minGridX && gridX <= maxGridX && gridY >= minGridY && gridY <= maxGridY))
      );
      $id('start_path_finding').onclick = () => {
        const staXYNum = getStaXyNum();
        if (!tileVerify(...staXYNum)) return alert('错误的起点，不可通行');
        const endXYNum = getEndXyNum();
        if (!tileVerify(...endXYNum)) return alert('错误的终点，不可通行');
        const pathXyNums = aStar(staXYNum, endXYNum, (originXyNum) => {
          return getNeighbors(originXyNum).filter(([gridX, gridY, cost, angStr]) => {
            return (
              // 启用的寻路方向
              dirConfs[angStr] &&
              // 合法可通行元素
              tileVerify(gridX, gridY)
            );
          });
        });
        if (!pathXyNums) return alert('没有通行路径。');
        clearPath();
        pathXyNums.forEach(([gridX, gridY, cost]) => {
          const [x, y] = getPosition([gridX, gridY], size, pos);
          addRoad(gridX, gridY, x, y, cost);
        });
      };
      $id('clear_path').onclick = clearPath;
    }());
  </script>
  
 
</body>
</html>
